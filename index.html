<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS を読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React を読み込み -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel を読み込み -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    /* アニメーション用のスタイル */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideRight { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    @keyframes bounceGentle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    
    .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
    .animate-slide-right { animation: slideRight 0.3s ease-out forwards; }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .animate-pulse-soft { animation: pulseSoft 2s infinite ease-in-out; }
    .animate-bounce-gentle { animation: bounceGentle 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-[#ebe6dd]">
  <!-- アプリ描画用コンテナ -->
  <div id="root"></div>

  <!-- React アプリケーションコード -->
  <script type="text/babel" data-presets="env,react" data-type="text/javascript">
    const { useState } = React;

    // ==========================================
    // LINE公式アカウントの設定
    // ==========================================
    const LINE_ACCOUNT_URL = "https://liff.line.me/1657509484-RgAyXZbq/landing?follow=%40015tjmpi&lp=WyhirG&liff_id=1657509484-RgAyXZbq"; 

    // ==========================================
    // アイコンコンポーネント (SVG)
    // ==========================================
    const ChevronLeft = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m15 18-6-6 6-6"/>
      </svg>
    );
    const RotateCcw = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
      </svg>
    );
    const GiftIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8V4H8a2 2 0 0 1 0-4h4V8z"/><path d="M12 8V4h4a2 2 0 0 0 0-4h-4V8z"/><path d="M4 12h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 12v10"/>
      </svg>
    );

    // ==========================================
    // 万能画像フォールバックコンポーネント
    // (画像が存在しない場合、自動的に各テイストに合わせたグラデーションを生成します)
    // ==========================================
    const SafeImage = ({ src, alt, className, style, ...props }) => {
      const [hasError, setHasError] = useState(false);

      if (hasError) {
        return (
          <div 
            className={`flex flex-col items-center justify-center p-4 text-center bg-gradient-to-br from-[#fdfbf7] to-[#e8dec9] border border-[#d6cbbe] ${className}`}
            style={{ ...style }}
          >
            <div className="text-emerald-700/60 font-bold text-xs tracking-wider mb-1">
              [Image: {alt}]
            </div>
            <div className="text-[10px] text-gray-400">エコハウス施工事例イメージ</div>
          </div>
        );
      }

      return (
        <img 
          src={src} 
          alt={alt} 
          className={className} 
          style={style}
          onError={() => setHasError(true)} 
          {...props} 
        />
      );
    };

    // ==========================================
    // デザイン・設定データ
    // ==========================================
    const tastes = [
      { id: 'natural', name: 'ナチュラル' },
      { id: 'antique', name: 'アンティーク' },
      { id: 'industrial', name: 'インダストリアル' },
      { id: 'japanese', name: '和モダン' },
      { id: 'hotel', name: 'ホテルライク' },
      { id: 'nordic', name: 'ミッドセンチュリー' },
    ];

    const casesData = {
      natural: [
        { id: 'natural-0', image: './images/N0.jpg', title: '明るく開放的なLDK', description: '大きな窓から自然光がたっぷり入る、明るく開放的なLDK。むき出しの木の梁や柱、木目のキッチンが温もりを感じさせ、大きな観葉植物がよく似合う空間です。' },
        { id: 'natural-1', image: './images/N1.jpg', title: '自然素材が心地よいダイニング', description: '斜め張りの木材が目を引くキッチンカウンターが主役のダイニング。ルーバー扉やラタンの照明など、自然素材をふんだんに取り入れた爽やかなスタイルです。' },
        { id: 'natural-2', image: './images/N2.jpg', title: 'カフェのような居心地の良い空間', description: 'モスグリーンのタイルで仕上げたキッチンカウンターと、木板張りの下がり天井がアクセント。木目の家具とたっぷりのグリーンが調和する、カフェのような居心地の良い空間です。' },
        { id: 'natural-3', image: './images/N3.jpg', title: 'ラフで自由な土間キッチン', description: '柱や梁、白い板張りの壁など、古い建物の趣を残しつつリノベーション。土間に置かれた大きなステンレスキッチンや木のテーブルが、ラフで自由な暮らしを想像させます。' },
        { id: 'natural-4', image: './images/N4.jpg', title: '庭の緑を楽しむナチュラルな住まい', description: '白い正方形タイルで造作されたアイランドキッチンと、木の梁見せ天井 of コントラストが美しいLDK。大きな窓から庭 of 緑を楽しめる、明るくナチュラルな住まいです。' },
        { id: 'natural-5', image: './images/N5.jpg', title: '光が通り抜けるサニタリー', description: 'ガラス的建具で仕切られた、光が通り抜ける開放的なサニタリースペース。コンクリート土間に自転車や観葉植物を無造作に置き、インドアグリーンのある暮らしを満喫できます。' }
      ],
      antique: [
        { id: 'antique-0', image: './images/A0.jpg', title: '落ち着いた色合いのアンティーク空間', description: 'クラシックな柄の壁紙とレンガ調 of 柱が目を引くリビング。ダークグリーンのキッチンカウンターや天井の木目など、落ち着いた色合いでまとめたアンティーク空間です。' },
        { id: 'antique-1', image: './images/A1.jpg', title: '特別なディスプレイススペース', description: '重厚な木製キャビネットやアンティークのフロアランプが存在感を放つ、ショップのような一角。お気に入りの小物を並べて楽しむ、特別なディスプレイススペースです。' },

        { id: 'antique-5', image: './images/A5.jpg', title: '優雅で明るい洋館風リビング', description: '吹き抜けの開放感とアーチ状 of 開口部が美しい、洋館を思わせるリビング。パーケットフローリングに大きな柱時計やクラシカルなソファが馴染む、優雅で明るい空間です。' }
      ],
      industrial: [
        { id: 'industrial-0', image: './images/I0.jpg', title: '洗練された無骨なLDK', description: 'むき出し of 黒い鉄骨とヘリンボーンの床が印象的な広々としたLDK。ダークウッド of kitchenカウンターやブルーのソファが、無骨さの中に洗練された雰囲力をプラスしています。' },
        { id: 'industrial-1', image: './images/I1.jpg', title: '男前なインダストリアルリビング', description: 'ラフなコンクリートむき出しの壁と天井が目を引くリビング。黒いダクトレール照明やインダストリアルなフロアランプ, ヴィンテージ調の小物が男前な空間を演出しています。' },
        { id: 'industrial-2', image: './images/I2.jpg', title: '無機質とグリーンの美しい対比', description: '古材を使ったキッチンカウンターと、無機質なコンクリート壁のコントラストが美しい空間. たくさんのグリーンが、クールな部屋に温かみと彩りを添えています。' },
        { id: 'industrial-3', image: './images/I3.jpg', title: 'スタイリッシュなハードテイスト', description: 'ステンレス製の大きなアイランドキッチンが存在感を放つLDK。天井のむき出し配管やスツールなど、工場や倉庫のようなハードな要素をスタイリッシュにまとめています。' },
        { id: 'industrial-4', image: './images/I4.jpg', title: 'ブルックリンスタイルのリビング', description: 'モルタル調の壁と、真鍮のような輝きを放つ大型のペンダントライトが特徴的なリビング. 重厚なレザーソファや黒枠の室内窓が、ブルックリンスタイルのようなかっこよさを引き立てます。' },
        { id: 'industrial-5', image: './images/I5.jpg', title: '自由でクリエイティブな小上がり空間', description: 'コンクリートの天井や壁をそのまま活かした、天井が高く開放的なリビング。一段上がった木造りの小上がりスペースや無骨なスチール家具が、自由でクリエイティブな暮らしを感じさせます。' }
      ],
      japanese: [
        { id: 'japanese-0', image: './images/J0.jpg', title: '和の趣とモダンが交差するダイニング', description: '木の温もりを感じる柱と板張りの天井が印象的なダイニング。障子風の窓やグレーのアクセントウォールが、和の趣とモダンな雰囲力を絶妙にミックスしています。' },
        { id: 'japanese-1', image: './images/J1.jpg', title: 'ノスタルジックな和のキッチン', description: '細やかなモザイクタイルとステンレスの組み合わせがスタイリッシュなキッチン. 使い込まれた木の扉やアンティークな食器棚が、ノスタルジックな和の空気を醸し出します。' },
        { id: 'japanese-2', image: './images/J2.jpg', title: '開放感あふれる古民家風LDK', description: '古民家の立派な梁や屋根裏をそのまま活かした、開放感あふれるLDK。モザイクタイルのカウンターやインダストリアルな照明が、和の空間に新しい息吹をもたらしています。' },
        { id: 'japanese-3', image: './images/J3.jpg', title: '和の静けさを感じるルーバー窓の空間', description: '美しい木目の勾配天井と、光を優しく取り込むルーバー窓が特徴的な空間。造作のキッチンカウンターや室内の一角に設けた緑が、和の静けさを感じさせます。' },
        { id: 'japanese-4', image: './images/J4.jpg', title: '縁側からの光が心地よいリビング', description: '伝統的な日本家屋の造りを残しつつ、モダンな囲炉裏テーブルを中央に配置。縁側から差し込む光が心地よい、広々とした畳と板間のリビングです。' },
        { id: 'japanese-5', image: './images/J5.jpg', title: '趣深い土間風の和空間', description: '土間の名残を感じる広いスペースに、モルタル仕上げのモダンなキッチンを新設。奥の和室や坪庭の緑を眺めながら食事を楽しめる、趣深い和空間です。' }
      ],
      hotel: [
        { id: 'hotel-0', image: './images/H0.jpg', title: 'リゾートホテルのような安らぎの空間', description: '木目の天井や柱と、石目調のアクセントウォールが調和する上質なリビング. 自然素材の温かみと洗練されたデザインが融合した、リゾートホテルのような安らぎ of 空間です。' },
        { id: 'hotel-1', image: './images/H1.jpg', title: '高級ホテルのラウンジ風モダンリビング', description: 'グレーを基調としたシックで都会的なリビング。大理石調 of 壁面パネルやゆったりとした大型ソファを配置し、高級ホテルのラウンジを思わせるモダンな空間に仕上げました。' },
        { id: 'hotel-2', image: './images/H2.jpg', title: '華やかで洗練されたLDK', description: '黒いフレームのガラスパーテーションが空間をスタイリッシュに仕切るLDK。印象的なデザインのペンダントライトや間接照明が、華やかで洗練された雰囲力を演出します。' },
        { id: 'hotel-3', image: './images/H3.jpg', title: '大人の隠れ家ホテルのようなリビング', description: 'レンンガ調 of 壁やコンクリートの質感が目を引く、重厚感のある空間. レザーのラウンジチェアを配し、ヴィンテージテイストを取り入れた大人の隠れ家ホテルのようなリビングです。' },
        { id: 'hotel-4', image: './images/H4.jpg', title: 'くつろぎの時間を過ごすベッドルーム', description: '落ち着いたグレージュのアクセントクロスと間接照明が、心地よい眠りを誘うベッドルーム。アートや小ぶりのソファを設え、くつろぎの時間を過ごすプライベータルームに。' },
        { id: 'hotel-5', image: './images/H5.jpg', title: '白とグレーの開放的なリビング', description: '吹き抜けからたっぷりと光が降り注ぐ、白とグレーで統一された開放的なリビング。石目調のテレビボード壁面やバーチカルブラインドが、空間をよりシャープに魅せています。' }
      ],
      nordic: [
        { id: 'nordic-0', image: './images/M0.jpg', title: 'ポップで楽しいミッドセンチュリー', description: '吹き抜けの開放的なリビングに、鮮やかなブルーのソファとイエロー of チェアが映える空間。グリーンのアクセントウォールや木製の手手すりが、ポップで楽しいミッドセンチュリーの世界観を演出しています。' },
        { id: 'nordic-1', image: './images/M1.jpg', title: '和と洋が調和したリビングダイニング', description: '美しい木目の板張り天井とパーケットフローリングが、空間全体に温かみを与えます。青緑色のソファや和紙のペンダントライトなど、和と洋が調和した落ち着きのあるリビングダイニングです。' },

        { id: 'nordic-3', image: './images/M3.jpg', title: '建築美を感じる芸術的な空間', description: 'ダイナミックな勾配天井 or 温かみのあるレンガ壁が特徴的な建築美を感じる空間。大きな窓から見える緑と、個性的なデザイン of チェアが、芸術的な雰囲力を醸し出しています。' },
        { id: 'nordic-4', image: './images/M4.jpg', title: 'レトロモダンなレンガ壁のリビング', description: '外の景色を大胆に取り込む大きな窓と、重厚なレンガ壁のコントラストが美しいリビング。ヴィンテージ感のあるレザーソファや幾学的な模様のラグが、レトロモダンな雰囲力を強調します。' },
        { id: 'nordic-5', image: './images/M5.jpg', title: 'レトロで温かいカフェ風ダイニング', description: '壁の腰壁や造作キャビネットなど、ふんだんに使われた木の質感が心地よいダイニング。特徴的なペンダントライトやたくさんの観葉植物が、レトロで温かいカフェのような空間を作っています。' }
      ]
    };

    // --- 診断結果データ（36事例個別） ---
    const diagnosticResults = {
      'natural-0': {
        title: "太陽と緑の心地よさを愛する\n「オープン・ナチュラル」タイプ",

        advice: "大きな窓を活かした明るい間取りがおすすめ。無垢材の家具や、部屋のシンボルとなるような大ぶりの観葉植物を取り入れると、さらに深呼吸したくなるような居心地の良さが生まれます。"
      },
      'natural-1': {
        title: "手仕事の温もりを愛する\n「クラフト・ナチュラル」タイプ",

        advice: "木目を活かした造作家具や、ラタン（籐）を使った照明・チェアを取り入れると魅力が引き立ちます。リネンやコットンなど、肌触りの良い天然素材のファブリックを選ぶのが統一感を出すポイントです。"
      },
      'natural-2': {

        advice: "キッチンを対面式のカウンターにし、こだわりのタイルやペンダントライトでカフェ風に演出してみましょう。木目調の下がり天井を取り入れると、空間にメリハリと落ち着きが生まれます。"

      },

        advice: "壁の下半分に板を張る「腰壁」や、木目の美しい造作キャビネットを取り入れましょう。少しレトロなデザインのペンダントライトをスライド、たくさんの観葉植物を飾れば理想のカフェ空間になります。"
      }
    };

    // ==========================================
    // メインアプリコンポーネント
    // ==========================================
    function App() {
      const [step, setStep] = useState(1);
      const [selectedTaste, setSelectedTaste] = useState(null);
      const [selectedCase, setSelectedCase] = useState(null);

      // --- 生活スタイル、欲しいものステート ---
      const [lifestyleAnswers, setLifestyleAnswers] = useState({ q1: "", q2: "", q3: "", q4: "", q5: "" });
      const [wantedFeatures, setWantedFeatures] = useState([]);
      const [step5Error, setStep5Error] = useState("");

      // --- 入力ステート（間取りタイプ・相談方法・連絡先情報） ---
      const [housePlanType, setHousePlanType] = useState(""); // 今住んでいる間取り / 中古で購入した物件の間取り
      const [receiveMethod, setReceiveMethod] = useState(""); // chat / mail / visit
      const [name, setName] = useState("");
      const [email, setEmail] = useState(""); // メールアドレス
      const [contact, setContact] = useState(""); // 郵送時（電話）、来店時（電話）
      const [postalCode, setPostalCode] = useState("");
      const [address, setAddress] = useState("");
      const [visitStore, setVisitStore] = useState(""); // 希望店舗
      const [visitDateTime, setVisitDateTime] = useState(""); // 来店希望日時
      const [message, setMessage] = useState(""); // その他ご要望

      // --- 図面添付関連ステート（任意） ---
      const [attachedFileName, setAttachedFileName] = useState(""); // ファイル名
      const [attachedFileData, setAttachedFileData] = useState(""); // Base64エンコードデータ

      const [isSubmitting, setIsSubmitting] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      // 図面ファイル選択時のハンドラ（Base64化してステートに保持する）
      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) {
          setAttachedFileName("");
          setAttachedFileData("");
          return;
        }

        setAttachedFileName(file.name);

        const reader = new FileReader();
        reader.onload = (event) => {
          // 変更: 'data:image/jpeg;base64,' などのプレフィックスを除去し、純粋なBase64文字列にする
          const base64Data = event.target.result.split(',')[1];
          setAttachedFileData(base64Data); 
        };
        reader.readAsDataURL(file);
      };

      // 図面ファイルのクリア機能
      const clearAttachedFile = () => {
        setAttachedFileName("");
        setAttachedFileData("");
        const fileInput = document.getElementById("blueprint-file-input");
        if (fileInput) fileInput.value = "";
      };

      // ★ LINE直接遷移・チャット相談の際、バックグラウンドで診断内容をMake Webhookへ連携する
      const sendDiagnosticsBackground = async () => {
        try {
          const webhookUrl = "https://hook.eu1.make.com/t4owxtu16pz830mbyshk1mdpoqhwoy6m"; 
          const formattedLifestyle = `【収納：${lifestyleAnswers.q1} / 洗濯：${lifestyleAnswers.q2} / 買い物：${lifestyleAnswers.q3} / キッチン：${lifestyleAnswers.q4} / 洗面脱衣：${lifestyleAnswers.q5}】`;
          
          const payload = {
            tasteName: selectedTaste?.name || "",
            caseId: selectedCase?.id || "",
            caseTitle: selectedCase?.title || "",
            diagnosticTitle: selectedCase ? diagnosticResults[selectedCase.id].title.replace('\n', ' ') : "",
            lifestyle: formattedLifestyle,
            wantedFeatures: wantedFeatures.join("、"),
            housePlanType: housePlanType,
            receiveMethod: "チャットで相談する",
            name: name.trim() ? name : "LINEユーザー",
            contact: "LINEチャット相談",
            email: "", // チャット相談時は空値
            contactDetails: `\n■連絡先\n・お名前： ${name}\n・相談方法： LINEチャット相談`,
            message: message.trim() ? `\n■ご質問・ご要望\n${message}` : "",
            attachedFileName: "",
            attachedFileData: ""
          };

          if (webhookUrl && webhookUrl !== "ここにコピーしたURLを貼り付けます") {
            fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(err => console.error("Background Webhook error:", err));
          }
        } catch (e) {
          console.error("Background send error:", e);
        }
      };

      // ★ 送信ボタンが押されたときの処理 (Make Webhook 連携 - 郵送・来店)
      const handleSendDirect = async () => {
        setErrorMsg("");
        
        // 基本バリデーション
        if (!housePlanType) {
          setErrorMsg("対象の間取りを選択してください。");
          return;
        }
        if (!receiveMethod) {
          setErrorMsg("お届け・ご相談方法を選択してください。");
          return;
        }
        if (!name.trim()) {
          setErrorMsg("お名前を入力してください。");
          return;
        }

        // メールアドレス簡易形式チェック
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email.trim() || !emailRegex.test(email)) {
          setErrorMsg("有効なメールアドレスをご入力ください。");
          return;
        }

        // お届け方法に応じた個別バリデーション
        if (receiveMethod === 'mail') {
          if (!postalCode.trim() || !address.trim()) {
            setErrorMsg("ご郵送先のご住所（郵便番号・住所）をご記入ください。");
            return;
          }
          if (!contact.trim()) {
            setErrorMsg("確認用の電話番号をご記入ください。");
            return;
          }
        }
        if (receiveMethod === 'visit') {
          if (!visitStore) {
            setErrorMsg("ご希望の店舗を選択してください。");
            return;
          }
          if (!visitDateTime) {
            setErrorMsg("ご来店希望日時を選択してください。");
            return;
          }
          if (!contact.trim()) {
            setErrorMsg("ご連絡先の電話番号をご記入ください。");
            return;
          }
        }
        
        setIsSubmitting(true);
        try {
          const webhookUrl = "https://hook.eu1.make.com/t4owxtu16pz830mbyshk1mdpoqhwoy6m"; 

          const formattedLifestyle = `【収納：${lifestyleAnswers.q1} / 洗濯：${lifestyleAnswers.q2} / 買い物：${lifestyleAnswers.q3} / キッチン：${lifestyleAnswers.q4} / 洗面脱衣：${lifestyleAnswers.q5}】`;
          const methodLabel = { mail: "郵送する", visit: "来店する" }[receiveMethod];

          // Slack通知等への書き出し情報組み立て
          let contactDetailsText = `\n■連絡先\n・お名前： ${name}\n・メールアドレス： ${email}\n・連絡先 / 電話番号： ${contact}`;
          if (receiveMethod === 'mail') {
            contactDetailsText += `\n・郵便番号： ${postalCode}\n・住所： ${address}`;
            if (attachedFileName) {
              contactDetailsText += `\n・添付図面ファイル： ${attachedFileName} (ファイルデータ添付済み)`;
            } else {
              contactDetailsText += `\n・添付図面ファイル： なし`;
            }
          } else if (receiveMethod === 'visit') {
            contactDetailsText += `\n・希望店舗： ${visitStore}\n・希望日時： ${visitDateTime}`;
          }

          let messageText = message.trim() ? `\n■ご質問・ご要望\n${message}` : "";

          // Webhookへ送るデータ構造
          const payload = {
            tasteName: selectedTaste?.name || "",
            caseId: selectedCase?.id || "",
            caseTitle: selectedCase?.title || "",
            diagnosticTitle: selectedCase ? diagnosticResults[selectedCase.id].title.replace('\n', ' ') : "",
            lifestyle: formattedLifestyle,
            wantedFeatures: wantedFeatures.join("、"),
            
            // フォームのデータ
            housePlanType: housePlanType, 
            receiveMethod: methodLabel,
            name: name,
            email: email,
            contact: contact,
            postalCode: postalCode,
            address: address,
            visitStore: visitStore,
            visitDateTime: visitDateTime,
            
            // 図面ファイル（任意）
            attachedFileName: attachedFileName,
            attachedFileData: attachedFileData, // Base64
            
            message: messageText,
            contactDetails: contactDetailsText
          };

          if (webhookUrl && webhookUrl !== "ここにコピーしたURLを貼り付けます") {
            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error("Network response was not ok");
            }
          }

          // 送信成功でステップ9（最終完了画面）へ進む
          setStep(9);
          window.scrollTo(0, 0);
        } catch (e) {
          console.error("送信エラー:", e);
          setErrorMsg("送信に失敗しました。お手数ですが、時間をおいて再度お試しください。");
        } finally {
          setIsSubmitting(false);
        }
      };

      // ==========================================
      // 各ステップのレンダリング
      // ==========================================

      // STEP 1: テイストの選択
      const renderStep1 = () => (
        <div className="animate-slide-up">
          <div className="mb-6 text-center">
            <h2 className="text-xl font-bold text-gray-800">どんな雰囲気が好きですか？</h2>
          </div>
          <div className="grid grid-cols-2 gap-4 md:gap-6">
            {tastes.map(taste => (
              <button
                key={taste.id}
                onClick={() => {
                  setSelectedTaste(taste);
                  setStep(2);
                  window.scrollTo(0, 0);
                }}
                className="flex flex-col items-center w-full group"
              >
                <div className="w-full p-2 rounded-2xl border-2 bg-white border-gray-200 shadow-[0_4px_0_0_#e5e7eb] group-active:shadow-[0_0px_0_0_transparent] group-active:translate-y-[4px] transition-all mb-2 overflow-hidden">
                  <SafeImage 
                    src={casesData[taste.id][0].image} 
                    alt={taste.name} 
                    className="w-full aspect-[4/3] rounded-xl object-cover" 
                  />
                </div>
                <span className="font-bold text-sm md:text-base text-gray-800 group-active:translate-y-[4px] transition-all">{taste.name}</span>
              </button>
            ))}
          </div>
        </div>
      );

      // STEP 2: 事例画像選択
      const renderStep2 = () => (
        <div className="animate-slide-right pb-6">
          <div className="mb-6 text-center">
            <h2 className="text-lg font-bold text-gray-800">
              {selectedTaste.name}の事例
            </h2>
          </div>
          <p className="text-center text-sm text-gray-500 mb-6">お好きな写真を選んでください</p>
          
          <div className="grid grid-cols-2 gap-4">
            {casesData[selectedTaste.id].map((caseItem, index) => (
              <button
                key={caseItem.id}
                onClick={() => {
                  setSelectedCase(caseItem);
                  setStep(3);
                  window.scrollTo(0, 0);
                }}
                className="bg-white p-2 rounded-2xl border-2 border-gray-100 shadow-[0_4px_0_0_#e5e7eb] active:shadow-[0_0px_0_0_#e5e7eb] active:translate-y-[4px] transition-all flex flex-col group overflow-hidden"
              >
                <SafeImage 
                  src={caseItem.image} 
                  alt={`${selectedTaste.name}の事例 ${index + 1}`} 
                  className="aspect-[4/3] rounded-xl w-full object-cover group-hover:opacity-90 transition-opacity" 
                />
              </button>
            ))}
          </div>

          <button 
            onClick={() => setStep(1)} 
            className="w-full mt-8 bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7z"/></svg>
            テイスト選択に戻る
          </button>
        </div>
      );

      // STEP 3: 事例詳細表示
      const renderStep3 = () => (
        <div className="animate-slide-up flex flex-col items-center pt-2 pb-6">
          <div className="bg-white w-full rounded-3xl shadow-[0_4px_15px_rgba(0,0,0,0.05)] overflow-hidden mb-6 border border-gray-100">
            <SafeImage 
              src={selectedCase.image} 
              alt={selectedCase.title} 
              className="w-full aspect-[4/3] object-cover" 
            />
            
            <div className="p-6 md:p-8 text-left">
              <h3 className="text-[1.1rem] md:text-xl font-bold text-[#5c8a22] mb-3">
                {selectedCase.title}
              </h3>
              
              <hr className="border-t-[1.5px] border-dashed border-gray-300 mb-4" />
              
              <p className="text-gray-700 leading-relaxed text-[15px] md:text-base">
                {selectedCase.description}
              </p>
            </div>
          </div>

          {/* ★ 「あなたのインテリア傾向を診断する」を中央寄せ縦2行に変更 */}
          <button 
            onClick={() => {
              setStep(4);
              window.scrollTo(0, 0);
            }}
            className="w-full mb-5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-3.5 px-6 rounded-3xl transition-all flex flex-col items-center justify-center gap-1 shadow-[0_4px_0_0_#c2410c] active:shadow-[0_0px_0_0_#c2410c] active:translate-y-1"
          >
            <span className="text-xs md:text-sm font-normal">この事例が好きなら...</span>
            <span className="text-[16px] md:text-lg flex items-center justify-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="shrink-0">
                <path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/>
              </svg>
              あなたのインテリア傾向を診断する
            </span>
          </button>

          <button 
            onClick={() => setStep(2)} 
            className="w-full bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7z"/></svg>
            別の事例を見る
          </button>
        </div>
      );

      // STEP 4: 診断結果表示
      const renderStep4 = () => {
        const result = diagnosticResults[selectedCase.id];
        return (
          <div className="animate-slide-up flex flex-col items-center pt-2 pb-6">
            <div className="mb-6 text-center">
              <h2 className="text-xl font-bold text-gray-800">診断結果</h2>
              <p className="text-sm text-gray-500 mt-2">あなたの好みの傾向がわかりました</p>
            </div>

            <div className="bg-white w-full rounded-3xl shadow-[0_4px_15px_rgba(0,0,0,0.05)] overflow-hidden mb-8 border-2 border-emerald-500 relative">
              <div className="bg-emerald-500 text-white text-center py-2 text-sm font-bold tracking-wider">
                あなたのタイプ
              </div>
              <div className="p-6 md:p-8">
                <h3 className="text-lg md:text-xl font-bold text-gray-800 text-center mb-6 whitespace-pre-wrap leading-relaxed">
                  {result.title}
                </h3>
                
                <div className="bg-[#f8f9fa] rounded-xl p-4 md:p-5 mb-5">
                  <p className="text-gray-700 leading-relaxed text-[15px] md:text-base">
                    {result.description}
                  </p>
                </div>
                
                <div className="bg-orange-50 rounded-xl p-4 md:p-5 border border-orange-100">
                  <h4 className="text-orange-600 font-bold mb-3 flex items-center gap-2 text-[15px]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    おすすめのアドバイス
                  </h4>
                  <p className="text-gray-700 leading-relaxed text-[14px] md:text-[15px]">
                    {result.advice}
                  </p>
                </div>
              </div>
            </div>

            <div className="w-full flex flex-col items-center">
              <button 
                onClick={() => {
                  setStep(5);
                  window.scrollTo(0, 0);
                }}
                className="w-full mb-5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-4 px-6 rounded-full transition-all flex items-center justify-center gap-2 shadow-[0_4px_0_0_#c2410c] active:shadow-[0_0px_0_0_#c2410c] active:translate-y-1"
              >
                <span className="text-[17px] md:text-lg">理想の家づくりプランへ進む</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>

            <button 
              onClick={() => {
                setStep(2);
                window.scrollTo(0, 0);
              }} 
              className="w-full mb-3 bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7z"/></svg>
              事例選択に戻る
            </button>

            <button 
              onClick={() => {
                setStep(1);
                window.scrollTo(0, 0);
              }} 
              className="w-full bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
            >
              <RotateCcw size={18} /> 最初からやり直す
            </button>
          </div>
        );
      };

      // STEP 5: 生活スタイル質問（Q1〜Q5）
      const renderStep5 = () => {
        const questions = [
          { id: 'q1', text: '収納のスタイルは？', options: ['見せるオープン収納', '生活感を隠す収納'] },
          { id: 'q2', text: 'お洗濯は？', options: ['部屋干し', '外干し', '乾燥機'] },
          { id: 'q3', text: 'お買い物は？', options: ['買い溜め派', 'こまめに買う派'] },
          { id: 'q4', text: 'キッチンは？', options: ['対面キッチン', '壁付けキッチン'] },
          { id: 'q5', text: '洗面室と脱衣室は？', options: ['一緒がいい', '別がいい'] }
        ];

        const handleAnswer = (qId, option) => {
          setLifestyleAnswers(prev => ({ ...prev, [qId]: option }));
          setStep5Error("");
        };

        return (
          <div className="animate-slide-up flex flex-col items-center pt-2 pb-6">
            <div className="mb-6 text-center">
              <h2 className="text-xl font-bold text-gray-800">もう少し教えてください</h2>
              <p className="text-sm text-gray-500 mt-2">1/2: あなたにぴったりのプランをご提案します</p>
            </div>

            {step5Error && (
              <div className="text-red-500 text-sm font-bold bg-red-50 p-3 rounded-lg border border-red-100 mb-4 w-full text-center">
                {step5Error}
              </div>
            )}

            <div className="w-full bg-white rounded-3xl shadow-[0_4px_15px_rgba(0,0,0,0.05)] p-5 md:p-8 mb-6 border border-gray-100">
              <h3 className="font-bold text-gray-800 mb-6 flex items-center gap-2 border-b pb-3">
                理想の生活スタイルは？ <span className="text-red-500 text-xs font-normal ml-auto">全問必須</span>
              </h3>
              
              <div className="flex flex-col gap-6">
                {questions.map((q, idx) => (
                  <div key={q.id} className="flex flex-col gap-2">
                    <p className="text-sm font-bold text-gray-700">Q{idx + 1}. {q.text}</p>
                    <div className={`flex gap-2 ${q.id === 'q2' ? 'flex-nowrap' : 'flex-wrap'}`}>
                      {q.options.map(opt => (
                        <label key={opt} className={`flex-1 flex items-center justify-center text-center p-2 md:p-3 rounded-xl border-2 cursor-pointer transition-all ${lifestyleAnswers[q.id] === opt ? 'border-emerald-500 bg-emerald-50 text-emerald-700 font-bold shadow-sm' : 'border-gray-200 hover:border-emerald-200 text-gray-600 bg-[#fbfbfb]'} ${q.id !== 'q2' ? 'min-w-[120px]' : 'min-w-0 px-1 md:px-3'}`}>
                          <input 
                            type="radio" 
                            name={q.id} 
                            value={opt} 
                            checked={lifestyleAnswers[q.id] === opt} 
                            onChange={() => handleAnswer(q.id, opt)}
                            className="hidden"
                          />
                          <span className={`${q.id === 'q2' ? 'text-[12px] md:text-[15px]' : 'text-[13px] md:text-[15px]'}`}>{opt}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <button 
              onClick={() => {
                const isAllAnswered = Object.values(lifestyleAnswers).every(val => val !== "");
                if (!isAllAnswered) {
                  setStep5Error("すべての質問にお答えください。");
                  return;
                }
                setStep(6);
                window.scrollTo(0, 0);
              }}
              className="w-full mb-5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-4 px-6 rounded-full transition-all flex items-center justify-center gap-2 shadow-[0_4px_0_0_#c2410c] active:shadow-[0_0px_0_0_#c2410c] active:translate-y-1"
            >
              <span className="text-[17px] md:text-lg">次の質問へ進む</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            
            <button 
              onClick={() => {
                setStep(4);
                window.scrollTo(0, 0);
              }} 
              className="w-full bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7z"/></svg>
              診断結果に戻る
            </button>
          </div>
        );
      };

      // STEP 6: 取り入れたいアイテム複数選択
      const renderStep6 = () => {
        const featureOptions = [
          { id: 'f1', name: "パントリー", desc: "食品や飲料、日用品などをストックしておくための専用の収納スペース。キッチン周りがスッキリ片付きます。", image: "./images/F_pantry.jpg" },
          { id: 'f2', name: "ヌック", desc: "ちょっとした空間を利用した、小ぢんまりとした居心地の良いこもり部屋。読書や休憩にぴったりです。", image: "./images/F_nook.jpg" },
          { id: 'f3', name: "WIC（ウォークインクローゼット）", desc: "人が歩いて入れる広さのクローゼット。衣類だけでなく、スーツケースや季節家電などもまとめて収納できます。", image: "./images/F_wic.jpg" },
          { id: 'f4', name: "SIC（シューズインクローク）", desc: "靴や傘、ベビーカー、アウトドア用品などを土足のまま収納できる玄関横のスペースです。", image: "./images/F_sic.jpg" },
          { id: 'f5', name: "土間", desc: "靴のまま過ごせる屋内空間。自転車のメンテナンスやDIY、観葉植物の手入れなど多目的に使えます。", image: "./images/F_doma.jpg" },
          { id: 'f6', name: "ワークスペース", desc: "在宅ワークや趣味の作業に集中できる専用のスペース。リビングの一角や独立した部屋として設けます。", image: "./images/F_workspace.jpg" },
          { id: 'f7', name: "キッズスペース", desc: "お子様が安全に遊べる専用のスペース。おもちゃの収納場所にもなり、リビングが散らかりにくくなります。", image: "./images/F_kids.jpg" },
          { id: 'f8', name: "ペットスペース", desc: "ペットが快適に過ごせる専用の居場所や、散歩帰りに足を洗える洗い場など、ペットとの暮らしを豊かにする工夫です。", image: "./images/F_pet.jpg" },
          { id: 'f9', name: "ランドリールーム", desc: "「洗う・干す・畳む・アイロンがけ」が1カ所で完結する家事専用の部屋。家事動線が大幅に短縮されます。", image: "./images/F_laundry.jpg" },
          { id: 'f10', name: "インナーバルコニー", desc: "建物の内側に引っ込んだ、屋根のある半屋外のバルコニー。天候を気にせず洗濯物を干したりくつろいだりできます。", image: "./images/F_inner_balcony.jpg" },
          { id: 'f11', name: "インナーガレージ", desc: "建物の一部に組み込まれた車やバイクのためのガレージ. 雨に濡れずに車に乗り降りでき、防犯性も高まります。", image: "./images/F_inner_garage.jpg" },
          { id: 'f12', name: "ホームライブラリー", desc: "壁一面の本棚や、読書に没頭できるスペース。本に囲まれた知的な時間を過ごせる空間です。", image: "./images/F_library.jpg" }
        ];

        const toggleFeature = (featureName) => {
          if (wantedFeatures.includes(featureName)) {
            setWantedFeatures(wantedFeatures.filter(f => f !== featureName));
          } else {
            setWantedFeatures([...wantedFeatures, featureName]);
          }
        };

        return (
          <div className="animate-slide-up flex flex-col items-center pt-2 pb-6">
            <div className="mb-6 text-center">
              <h2 className="text-xl font-bold text-gray-800">あと少しです</h2>
              <p className="text-sm text-gray-500 mt-2">2/2: あなたにぴったりのプランをご提案します</p>
            </div>

            <div className="w-full mb-8">
              <div className="flex items-center justify-between mb-4 px-1">
                <h3 className="font-bold text-gray-800 text-[17px]">
                  自宅に取り入れたいものは？
                </h3>
                <span className="text-emerald-700 font-bold text-xs bg-emerald-100 px-2.5 py-1 rounded-full shadow-sm">
                  複数選択可
                </span>
              </div>
              <div className="flex flex-col gap-4">
                {featureOptions.map(feature => {
                  const isSelected = wantedFeatures.includes(feature.name);
                  return (
                    <label
                      key={feature.id}
                      className={`relative flex flex-col rounded-2xl border-2 overflow-hidden cursor-pointer transition-all duration-200 ${
                        isSelected
                          ? 'border-emerald-500 shadow-[0_4px_15px_rgba(16,185,129,0.2)] scale-[1.02] bg-emerald-50 z-10'
                          : 'border-transparent bg-white shadow-[0_4px_10px_rgba(0,0,0,0.06)] hover:border-emerald-200'
                      }`}
                    >
                      <input
                        type="checkbox"
                        checked={isSelected}
                        onChange={() => toggleFeature(feature.name)}
                        className="hidden"
                      />
                      <div className="relative">
                        <SafeImage 
                          src={feature.image} 
                          alt={feature.name} 
                          className="w-full h-40 md:h-48 object-cover transition-opacity duration-200"
                          style={{ opacity: isSelected ? 0.9 : 1 }}
                        />
                        {isSelected && (
                          <>
                            <div className="absolute inset-0 bg-emerald-900/10 mix-blend-multiply"></div>
                            <div className="absolute top-3 right-3 bg-emerald-500 text-white rounded-full p-1.5 shadow-lg animate-fade-in">
                              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                          </>
                        )}
                        {!isSelected && (
                          <div className="absolute top-3 right-3 w-7 h-7 rounded-full border-2 border-white bg-black/20 shadow-sm flex items-center justify-center backdrop-blur-sm"></div>
                        )}
                      </div>
                      <div className="p-4 md:p-5">
                        <h4 className={`font-bold text-[16px] mb-2 flex items-center gap-2 ${isSelected ? 'text-emerald-800' : 'text-gray-800'}`}>
                          {feature.name}
                        </h4>
                        <p className={`text-[13px] md:text-[14px] leading-relaxed ${isSelected ? 'text-emerald-700' : 'text-gray-600'}`}>
                          {feature.desc}
                        </p>
                      </div>
                    </label>
                  );
                })}
              </div>
            </div>

            <button 
              onClick={() => {
                setStep(7);
                window.scrollTo(0, 0);
              }}
              className="w-full mb-5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-4 px-6 rounded-full transition-all flex items-center justify-center gap-2 shadow-[0_4px_0_0_#c2410c] active:shadow-[0_0px_0_0_#c2410c] active:translate-y-1"
            >
              <span className="text-[17px] md:text-lg">あなただけのプランを見る</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            
            <button 
              onClick={() => {
                setStep(5);
                window.scrollTo(0, 0);
              }} 
              className="w-full bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7z"/></svg>
              前の質問に戻る
            </button>
          </div>
        );
      };

      // STEP 7: あなたへのご提案 ＆ プレゼント獲得ボタンへの誘導
      const renderStep7 = () => {
        const otherCases = casesData[selectedTaste.id].filter(c => c.id !== selectedCase.id);
        const recommendImage = otherCases.length > 0 ? otherCases[0].image : selectedCase.image;

        return (
          <div className="animate-slide-up flex flex-col items-center pt-2 pb-6">
            <div className="mb-6 text-center">
              <h2 className="text-xl font-bold text-gray-800">あなたへのご提案</h2>
              <p className="text-sm text-gray-500 mt-2">理想の暮らしをカタチに</p>
            </div>

            {/* ご提案カード */}
            <div className="bg-white w-full rounded-3xl shadow-[0_4px_15px_rgba(0,0,0,0.05)] overflow-hidden mb-6 border border-gray-100">
              <div className="relative">
                <SafeImage 
                  src={recommendImage} 
                  alt="ご提案事例" 
                  className="w-full aspect-[4/3] object-cover" 
                />
                <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent flex items-end">
                  <div className="p-5 text-white">
                    <span className="inline-block bg-emerald-500 text-xs font-bold px-2 py-1 rounded mb-2">おすすめスタイル</span>
                    <h3 className="text-lg font-bold">{selectedTaste.name}の空間で叶える理想の暮らし</h3>
                  </div>
                </div>
              </div>
              
              <div className="p-6 md:p-8">
                <div className="bg-orange-50/50 rounded-xl p-5 border border-orange-100">
                  <p className="text-gray-700 leading-relaxed text-[15px] md:text-base mb-4 font-medium">
                    お客様が選ばれた「<span className="text-orange-600 font-bold">{selectedTaste.name}</span>」のテイスト。
                    その心地よい空間をベースに、お答えいただいた生活スタイルに合わせた特別プランをご用意いたしました。
                  </p>
                  
                  {wantedFeatures.length > 0 && (
                    <p className="text-gray-700 leading-relaxed text-[15px] md:text-base mb-4">
                      ご希望のアイテム「<span className="font-bold">{wantedFeatures.join("、")}</span>」を盛り込んだ、毎日がわくわくする設計をご提案します。
                    </p>
                  )}
                </div>
              </div>
            </div>

            {/* オリジナルプランプレゼントを獲得するセクション */}
            <div className="w-full relative mt-4 mb-6 bg-gradient-to-br from-emerald-50 to-[#f5eedf] rounded-3xl shadow-md border border-emerald-100 p-6 overflow-hidden flex flex-col justify-between min-h-[250px]">
              
              {/* 背景の装飾サークル */}
              <div className="absolute -top-10 -left-10 w-32 h-32 bg-emerald-100/40 rounded-full blur-xl pointer-events-none"></div>

              {/* ★ アップロードされた案内女性の画像を枠内右上に絶対配置 */}
              <div className="absolute right-0 top-3 w-[120px] md:w-[130px] h-[130px] md:h-[150px] pointer-events-none z-10 flex items-end justify-end">
                <img 
                  src="./images/IMG_0183.png" 
                  alt="案内スタッフ" 
                  className="max-h-full max-w-full object-contain object-bottom filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.1)]"
                  onError={(e) => {
                    // 万が一読み込めなかった場合のフォールバック
                    e.target.style.display = 'none';
                  }}
                />
              </div>

              {/* コンテンツエリア - 右上に画像が美しく配置されるため、重なりを避けるよう横幅を w-[72%] に最適調整 */}
              <div className="relative z-20 w-[72%] text-left flex flex-col justify-center h-full">
                <div className="bg-white text-emerald-800 text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow-sm w-fit mb-2.5 border border-emerald-100">
                  診断メンバー限定特典
                </div>
                {/* ★ スマホ画面幅（特に最小320px等）でも「オリジナルプランプレゼント！」が絶対に1列（改行なし）で綺麗に収まるよう、
                     tracking-tighter（文字詰め）、whitespace-nowrap（改行防止）、および最適な縮小幅を調整しました */}
                <h4 className="font-black text-gray-800 leading-tight mb-3">
                  <span className="block text-[13px] min-[375px]:text-[14px] md:text-[16px] text-gray-600 font-bold">
                    あなただけの
                  </span>
                  <span className="block text-[14.5px] min-[360px]:text-[16px] min-[375px]:text-[18px] min-[410px]:text-[20px] md:text-[23px] text-orange-500 font-black tracking-tighter whitespace-nowrap mt-1">
                    オリジナルプランプレゼント！
                  </span>
                </h4>
                <p className="text-[11px] md:text-[12px] text-gray-500 leading-relaxed mb-4">
                  間取り診断の結果を元にした、お客様専用の個別プランをお届けします。
                </p>
              </div>

              {/* プレゼントボタン */}
              <div className="relative z-30 mt-auto w-full">
                <button
                  onClick={() => {
                    setStep(8);
                    window.scrollTo(0, 0);
                  }}
                  className="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-extrabold py-4 px-2 rounded-full shadow-[0_5px_0_0_#c2410c] active:shadow-[0_0px_0_0_#c2410c] active:translate-y-1 transition-all flex items-center justify-center gap-1 min-[375px]:gap-2 text-[11px] min-[360px]:text-[12px] min-[390px]:text-[14px] md:text-base whitespace-nowrap animate-pulse-soft"
                >
                  <GiftIcon size={18} className="animate-bounce-gentle shrink-0" />
                  オリジナルプランプレゼントをもらう
                </button>
              </div>
            </div>

            {/* 戻るボタン */}
            <button 
              onClick={() => {
                setStep(6);
                window.scrollTo(0, 0);
              }} 
              className="w-full bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7z"/></svg>
              質問に戻る
            </button>
          </div>
        );
      };

      // STEP 8: プランプレゼント入力フォーム (間取り・お届け方法・動的入力)
      const renderStep8 = () => {
        return (
          <div className="animate-slide-up flex flex-col items-center pt-2 pb-6">
            <div className="mb-6 text-center">
              <h2 className="text-xl font-bold text-gray-800">プレゼントのお届け先</h2>
              <p className="text-sm text-gray-500 mt-2">ご希望の間取りタイプとお届け方法をお選びください</p>
            </div>

            {errorMsg && (
              <div className="text-red-500 text-sm font-bold bg-red-50 p-4 rounded-2xl border border-red-100 mb-4 w-full text-center animate-fade-in">
                {errorMsg}
              </div>
            )}

            <div className="bg-white w-full rounded-3xl shadow-[0_4px_15px_rgba(0,0,0,0.05)] p-6 md:p-8 border border-gray-100 mb-6 text-left">
              
              {/* 1. 間取りタイプの選択 */}
              <div className="mb-6">
                <span className="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2 py-0.5 rounded-md mb-2 inline-block">必須</span>
                <label className="block text-sm font-bold text-gray-800 mb-2">
                  Q1. 計画されているお住まいについて教えてください
                </label>
                <div className="flex flex-col gap-3">
                  <label className={`flex items-center gap-3 p-3.5 rounded-xl border-2 cursor-pointer transition-all ${housePlanType === '今住んでいる間取り' ? 'border-emerald-500 bg-emerald-50/50 font-bold text-emerald-900' : 'border-gray-200 hover:border-emerald-200 text-gray-700 bg-[#fbfbfb]'}`}>
                    <input 
                      type="radio" 
                      name="housePlanType" 
                      value="今住んでいる間取り" 
                      checked={housePlanType === '今住んでいる間取り'}
                      onChange={(e) => setHousePlanType(e.target.value)}
                      className="accent-emerald-600 w-4 h-4"
                    />
                    <div className="flex flex-col text-left">
                      <span className="text-[14px]">今住んでいる間取りをリフォームしたい</span>
                      <span className="text-xs text-gray-500 font-normal mt-0.5">現在の自宅の間取りをベースにプラン変更をご希望の方</span>
                    </div>
                  </label>
                  
                  <label className={`flex items-center gap-3 p-3.5 rounded-xl border-2 cursor-pointer transition-all ${housePlanType === '中古で購入した物件の間取り' ? 'border-emerald-500 bg-emerald-50/50 font-bold text-emerald-900' : 'border-gray-200 hover:border-emerald-200 text-gray-700 bg-[#fbfbfb]'}`}>
                    <input 
                      type="radio" 
                      name="housePlanType" 
                      value="中古で購入した物件の間取り" 
                      checked={housePlanType === '中古で購入した物件の間取り'}
                      onChange={(e) => setHousePlanType(e.target.value)}
                      className="accent-emerald-600 w-4 h-4"
                    />
                    <div className="flex flex-col text-left">
                      <span className="text-[14px]">中古で購入した物件の間取りをリフォームしたい</span>
                      <span className="text-xs text-gray-500 font-normal mt-0.5">新しく購入した（または検討中の）中古物件を理想に変更したい方</span>
                    </div>
                  </label>
                </div>
              </div>

              <hr className="my-6 border-dashed border-gray-200" />

              {/* 2. お届け・ご相談方法の選択 */}
              <div className="mb-6">
                <span className="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2 py-0.5 rounded-md mb-2 inline-block">必須</span>
                <label className="block text-sm font-bold text-gray-800 mb-3">
                  Q2. オリジナルプランの受取方法をお選びください
                </label>
                
                {/* 3並びボタン：スマートフォン向けにパディングを小さくし、テキストの改行・文字溢れを防ぐ */}
                <div className="grid grid-cols-3 gap-1.5 min-[375px]:gap-2">
                  
                  <button
                    type="button"
                    onClick={() => {
                      if (!housePlanType) {
                        setErrorMsg("「チャットで相談する」に進む前に、上部の「計画されているお住まい」を選択してください。");
                        return;
                      }
                      setReceiveMethod('chat');
                      setErrorMsg("");
                    }}
                    className={`flex flex-col items-center justify-center gap-2 p-2 md:p-3 rounded-xl border-2 transition-all text-center ${
                      receiveMethod === 'chat'
                        ? 'border-emerald-500 bg-emerald-50 text-emerald-800 font-bold shadow-sm'
                        : 'border-gray-200 hover:border-emerald-200 text-gray-600 bg-[#fbfbfb]'
                    }`}
                  >
                    <span className="text-2xl">💬</span>
                    <span className="text-[10px] min-[360px]:text-[11px] md:text-[12px] leading-tight font-bold whitespace-nowrap tracking-tighter">チャットで相談する</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => { setReceiveMethod('mail'); setErrorMsg(""); }}
                    className={`flex flex-col items-center gap-2 p-2 md:p-3 rounded-xl border-2 transition-all ${receiveMethod === 'mail' ? 'border-emerald-500 bg-emerald-50 text-emerald-800 font-bold shadow-sm' : 'border-gray-200 hover:border-emerald-200 text-gray-600 bg-[#fbfbfb]'}`}
                  >
                    <span className="text-2xl">✉️</span>
                    <span className="text-[10px] min-[360px]:text-[11px] md:text-[13px] font-bold whitespace-nowrap tracking-tighter">郵送する</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => { setReceiveMethod('visit'); setErrorMsg(""); }}
                    className={`flex flex-col items-center gap-2 p-2 md:p-3 rounded-xl border-2 transition-all ${receiveMethod === 'visit' ? 'border-emerald-500 bg-emerald-50 text-emerald-800 font-bold shadow-sm' : 'border-gray-200 hover:border-emerald-200 text-gray-600 bg-[#fbfbfb]'}`}
                  >
                    <span className="text-2xl">🏠</span>
                    <span className="text-[10px] min-[360px]:text-[11px] md:text-[13px] font-bold whitespace-nowrap tracking-tighter">来店する</span>
                  </button>
                </div>
              </div>

              {/* 3. 動的フォームセクション（受取方法が選択されたら入力フォームを表示） */}
              {receiveMethod && (
                <div className="bg-[#fcfbf9] rounded-2xl p-4 md:p-5 border border-[#dfd6cb] animate-fade-in flex flex-col gap-4">
                  <h4 className="text-[14px] font-bold text-gray-800 border-b pb-2 mb-2 flex items-center gap-2">
                    <span>📝</span>
                    {receiveMethod === 'chat' && 'チャット相談に必要な情報'}
                    {receiveMethod === 'mail' && '資料のご郵送に必要な情報'}
                    {receiveMethod === 'visit' && 'ご来店相談の予約情報'}
                  </h4>

                  {/* 共通項目: お名前 */}
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">
                      お名前 <span className="text-red-500">*</span>
                    </label>
                    <input 
                      type="text" 
                      value={name} 
                      onChange={e => setName(e.target.value)}
                      className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px]" 
                      placeholder="例: 山田 太郎"
                    />
                  </div>

                  {/* ★ チャット相談＆お名前が入力されたら動的にボタンが出現するエリア */}
                  {receiveMethod === 'chat' && name.trim() !== "" && (
                    <div className="mt-2 animate-slide-up">
                      <p className="text-xs text-emerald-700 font-bold bg-emerald-50 border border-emerald-100 p-2.5 rounded-lg mb-3">
                        下のボタンを押すと、診断内容を保存して公式LINEチャットへ移動します。
                      </p>
                      <a
                        href={LINE_ACCOUNT_URL}
                        target="_blank"
                        rel="noopener noreferrer"
                        onClick={() => {
                          sendDiagnosticsBackground(); // バックグラウンドでMakeにデータ送信
                          setStep(9); // 完了画面へ遷移
                          window.scrollTo(0, 0);
                        }}
                        className="w-full bg-[#06C755] hover:bg-[#05B34C] active:bg-[#049F43] text-white font-extrabold py-3.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-[0_4px_0_0_#049f43] active:shadow-[0_0px_0_0_transparent] active:translate-y-1 text-[15px] text-center"
                      >
                        <span>💬</span>
                        LINEでチャット相談する
                      </a>
                    </div>
                  )}

                  {/* 郵送用のフォーム */}
                  {receiveMethod === 'mail' && (
                    <>
                      {/* ★追加: メールアドレス入力欄（必須） */}
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          メールアドレス <span className="text-red-500">*</span>
                        </label>
                        <input 
                          type="email" 
                          value={email} 
                          onChange={e => setEmail(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px]" 
                          placeholder="例: ecohouse@example.com"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          郵便番号 <span className="text-red-500">*</span>
                        </label>
                        <input 
                          type="text" 
                          value={postalCode} 
                          onChange={e => setPostalCode(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px]" 
                          placeholder="例: 123-4567"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          ご住所 <span className="text-red-500">*</span>
                        </label>
                        <input 
                          type="text" 
                          value={address} 
                          onChange={e => setAddress(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px]" 
                          placeholder="例: 東京都〇〇区〇-〇-〇 マンション名101"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          お電話番号（配送時確認用） <span className="text-red-500">*</span>
                        </label>
                        <input 
                          type="text" 
                          value={contact} 
                          onChange={e => setContact(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px]" 
                          placeholder="例: 090-1234-5678"
                        />
                      </div>

                      {/* ★追加・修正: 図面添付（任意、必須マークなし）：「現在」を消して「間取り図」へ変更 */}
                      <div className="mt-2 bg-white rounded-xl p-3 border border-gray-200 shadow-sm">
                        <label className="block text-xs font-bold text-gray-700 mb-1.5 flex items-center justify-between">
                          <span>📐 間取り図・図面添付 (任意)</span>
                          <span className="text-[10px] text-gray-400 font-normal">画像またはPDF</span>
                        </label>
                        <div className="flex flex-col gap-2">
                          <input 
                            type="file" 
                            id="blueprint-file-input"
                            accept="image/*,application/pdf"
                            onChange={handleFileChange}
                            className="text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer w-full"
                          />
                          {attachedFileName && (
                            <div className="flex items-center justify-between bg-emerald-50/50 px-2 py-1.5 rounded border border-emerald-100 text-xs text-emerald-800 animate-fade-in">
                              <span className="truncate max-w-[80%] font-medium">📎 {attachedFileName}</span>
                              <button 
                                type="button" 
                                onClick={clearAttachedFile}
                                className="text-[10px] bg-red-100 hover:bg-red-200 text-red-700 font-bold px-1.5 py-0.5 rounded transition-colors"
                              >
                                削除
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    </>
                  )}

                  {/* 来店用のフォーム */}
                  {receiveMethod === 'visit' && (
                    <>
                      {/* ★追加: メールアドレス入力欄（必須） */}
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          メールアドレス <span className="text-red-500">*</span>
                        </label>
                        <input 
                          type="email" 
                          value={email} 
                          onChange={e => setEmail(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px]" 
                          placeholder="例: ecohouse@example.com"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          ご希望のショールーム店舗 <span className="text-red-500">*</span>
                        </label>
                        <select 
                          value={visitStore} 
                          onChange={e => setVisitStore(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 bg-white outline-none transition-all text-[14px]"
                        >
                          <option value="">店舗をお選びください</option>
                          <optgroup label="SHOWROOM 各支店">
                            <option value="吉祥寺">吉祥寺 (KICHIJOJI)</option>
                            <option value="板橋">板橋 (ITABASHI)</option>
                            <option value="浦和">浦和 (URAWA)</option>
                            <option value="さいたま宮原">さいたま宮原 (SAITAMA MIYAHARA)</option>
                            <option value="越谷">越谷 (KOSHIGAYA)</option>
                            <option value="川越">川越 (KAWAGOE)</option>
                            <option value="高崎">高崎 (TAKASAKI)</option>
                            <option value="前橋">前橋 (MAEBASHI)</option>
                          </optgroup>
                        </select>
                      </div>
                      {/* ★修正: スマートフォン画面等ではみ出さないよう、日時入力欄のスタイルを最適化 */}
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          来店希望日時 <span className="text-red-500">*</span>
                        </label>
                        <input 
                          type="datetime-local" 
                          value={visitDateTime} 
                          onChange={e => setVisitDateTime(e.target.value)}
                          className="w-full min-w-0 box-border p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px] bg-white" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">
                          ご連絡先お電話番号 <span className="text-red-500">*</span>
                        </label>
                        <input 
                          type="text" 
                          value={contact} 
                          onChange={e => setContact(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all text-[14px]" 
                          placeholder="例: 090-1234-5678"
                        />
                      </div>
                    </>
                  )}

                  {/* ★修正: 自由記入欄は、チャット相談時以外の時のみ（郵送・来店時のみ）表示するように分岐 */}
                  {receiveMethod !== 'chat' && (
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">
                        ご質問や理想の条件（自由記入）
                      </label>
                      <textarea 
                        value={message} 
                        onChange={e => setMessage(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all h-20 resize-none text-[13px]" 
                        placeholder="「LDKを広くしたい」「和室を残したい」など、こだわりがあれば自由にご記入ください。"
                      />
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* 郵送・来店時用の送信ボタン (チャット以外の時に表示) */}
            {receiveMethod && receiveMethod !== 'chat' && (
              <button 
                onClick={handleSendDirect}
                disabled={isSubmitting || !receiveMethod || !housePlanType}
                className={`w-full text-white font-bold py-4 px-6 rounded-full transition-all flex items-center justify-center gap-2 mb-4 ${
                  isSubmitting || !receiveMethod || !housePlanType
                    ? 'bg-gray-400 cursor-not-allowed shadow-none' 
                    : 'bg-orange-500 hover:bg-orange-600 active:bg-orange-700 shadow-[0_4px_0_0_#c2410c] active:shadow-[0_0px_0_0_#c2410c] active:translate-y-1'
                }`}
              >
                {isSubmitting ? (
                  <span className="flex items-center gap-2">
                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    送信中...
                  </span>
                ) : (
                  <span className="flex items-center gap-2 text-[16px]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                    この内容でプラン作成を申し込む
                  </span>
                )}
              </button>
            )}

            <button 
              onClick={() => {
                setStep(7);
                window.scrollTo(0, 0);
              }} 
              className="w-full bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7z"/></svg>
              ご提案に戻る
            </button>
          </div>
        );
      };

      // STEP 9: 送信完了画面
      const renderStep9 = () => {
        const methodLabels = { chat: 'LINEチャット相談', mail: 'ご指定 of 住所へのご郵送', visit: 'ご来店相談' };
        return (
          <div className="animate-slide-up flex flex-col items-center pt-10 pb-6 text-center">
            <div className="bg-emerald-100 text-emerald-600 rounded-full w-20 h-20 flex items-center justify-center mb-6 shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h2 className="text-2xl font-bold text-gray-800 mb-4">お申し込み完了</h2>
            <p className="text-gray-600 leading-relaxed mb-6 px-4 text-sm md:text-base">
              お申し込み誠にありがとうございます！<br />
              ご希望いただいた<strong>【{methodLabels[receiveMethod] || '窓口'}】</strong>にて、あなた好みの「{selectedTaste?.name || ""}」をベースとしたオリジナル特別プランをお届け・ご用意いたします。
            </p>

            <p className="text-xs text-gray-500 mb-8 bg-emerald-50 border border-emerald-100 p-3.5 rounded-xl">
              ※ご記入いただいた内容に沿って、担当アドバイザーより順次準備・ご連絡いたします。楽しみにお待ちください！
            </p>
            <button 
              onClick={() => {
                setStep(1);
                setName("");
                setEmail(""); // 初期化
                setContact("");
                setPostalCode("");
                setAddress("");
                setVisitStore("");
                setVisitDateTime("");
                setMessage("");
                setErrorMsg("");
                setHousePlanType("");
                setReceiveMethod("");
                setAttachedFileName(""); // ファイルクリア
                setAttachedFileData(""); // ファイルデータクリア
                setLifestyleAnswers({ q1: "", q2: "", q3: "", q4: "", q5: "" });
                setWantedFeatures([]);
                window.scrollTo(0, 0);
              }} 
              className="w-full bg-[#dfd6cb] hover:bg-[#d4cbbd] active:bg-[#cabbab] text-gray-800 font-bold py-3.5 px-6 rounded-full transition-colors shadow-sm"
            >
              診断のトップに戻る
            </button>
          </div>
        );
      };

      return (
        <div className="min-h-screen font-sans flex justify-center">
          <div className="w-full max-w-md bg-[#f5f0e6] min-h-screen shadow-lg flex flex-col relative overflow-hidden">
            
            {/* ヘッダー */}
            <header className="pt-4 pb-3 px-4 flex items-center justify-center gap-3 text-white bg-emerald-600 shadow-md mb-6 relative z-10 border-b border-emerald-700">
              <div className="h-20 w-20 flex items-center justify-center shrink-0">
                 <img src="./images/logowhite.png" alt="エコハウスロゴ" className="w-full h-full object-contain border-0 outline-none" onError={(e) => {
                   e.target.style.display = 'none';
                 }} />
              </div>
              <h1 className="text-[17px] sm:text-lg font-extrabold tracking-wider">エコハウステイスト診断</h1>
            </header>

            {/* メインコンテンツ */}
            <main className="flex-1 px-5 pb-10">
              {step === 1 && renderStep1()}
              {step === 2 && renderStep2()}
              {step === 3 && renderStep3()}
              {step === 4 && renderStep4()}
              {step === 5 && renderStep5()}
              {step === 6 && renderStep6()}
              {step === 7 && renderStep7()}
              {step === 8 && renderStep8()}
              {step === 9 && renderStep9()}
            </main>
          </div>
        </div>
      );
    }

    // アプリを描画先にマウント
    const rootElement = document.getElementById('root');

    try {
      if (!rootElement) {
        throw new Error('描画先の #root が見つかりません。');
      }

      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    } catch (error) {
      console.error('アプリの描画に失敗しました:', error);
      rootElement.innerHTML = `
        <div style="padding: 24px; font-family: sans-serif; color: #b91c1c;">
          <h1 style="font-size: 20px; font-weight: bold;">アプリの読み込みに失敗しました</h1>
          <p>Console に表示されているエラーを確認してください。</p>
          <pre style="white-space: pre-wrap; background: #fee2e2; padding: 12px; border-radius: 8px;">${error.message}</pre>
        </div>
      `;
    }
  </script>
</body>
</html>
